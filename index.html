<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Juegoteca & Wishlist del Señor Gris</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse para procesar CSV de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --transition-speed: 0.3s;
        }

        /* ESTILOS BASE - MODO JUEGOTECA */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* HEADER & BARRA TOP CON CONTROLES EN LAS ESQUINAS */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            min-height: 45px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            transition: color var(--transition-speed) ease, text-shadow var(--transition-speed) ease;
        }

        /* CHECKBOX BACKLOG (ESQUINA IZQUIERDA) */
        .backlog-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.88rem;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .backlog-container:hover {
            border-color: var(--accent-color);
        }

        .backlog-container input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
        }

        /* TOGGLE DE MODO (ESQUINA DERECHA) */
        .toggle-container {
            display: flex;
            align-items: center;
            background: #1e293b;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
        }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            color: #94a3b8;
        }

        .toggle-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all var(--transition-speed) ease;
        }

        .stat-card span {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .stat-card strong {
            font-size: 1.4rem;
            color: #f1f5f9;
        }

        /* FILTROS */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            transition: all var(--transition-speed) ease;
        }

        .filters input, .filters select, .filters button {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .filters input:focus, .filters select:focus {
            border-color: var(--accent-color);
        }

        .btn-clear {
            background-color: #334155 !important;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-clear:hover {
            background-color: #475569 !important;
        }

        /* GRID DE TARJETAS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background-color: #000;
            cursor: pointer;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card-img-container:hover img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-body h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .score-box {
            font-weight: bold;
            font-size: 0.95rem;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: auto;
            align-self: flex-start;
            background-color: #334155;
            color: #fff;
        }

        .score-gold { background-color: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
        .score-good { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .score-mid  { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .score-backlog { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }

        .comment {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 10px;
            font-style: italic;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        /* PAGINACIÓN */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .pagination button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button:not(:disabled):hover {
            background-color: var(--accent-color);
        }

        /* LIGHTBOX DE IMAGEN */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* =========================================================
           CAMBIO DE ESTILO NEÓN CYBERPUNK (WISHLIST)
           ========================================================= */
        body.mode-wishlist {
            background-color: #0d0714;
            color: #f3e8ff;
        }

        body.mode-wishlist h1 {
            color: #e879f9;
            text-shadow: 0 0 10px rgba(232, 121, 249, 0.6), 0 0 20px rgba(168, 85, 247, 0.4);
        }

        body.mode-wishlist .toggle-container {
            background: #1a0b2e;
            border-color: #3b0764;
        }

        body.mode-wishlist .toggle-btn.active {
            background: linear-gradient(135deg, #a855f7, #d946ef);
            color: white;
            box-shadow: 0 0 12px rgba(217, 70, 239, 0.7);
        }

        body.mode-wishlist .stat-card,
        body.mode-wishlist .filters {
            background-color: #160d27;
            border-color: #3b0764;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.08);
        }

        body.mode-wishlist .filters input,
        body.mode-wishlist .filters select {
            background-color: #0d0714;
            border-color: #581c87;
            color: #f3e8ff;
        }

        body.mode-wishlist .filters input:focus,
        body.mode-wishlist .filters select:focus {
            border-color: #c084fc;
            box-shadow: 0 0 8px rgba(192, 132, 252, 0.5);
        }

        body.mode-wishlist .btn-clear {
            background-color: #3b0764 !important;
        }

        body.mode-wishlist .btn-clear:hover {
            background-color: #581c87 !important;
        }

        body.mode-wishlist .card {
            background-color: #160d27;
            border-color: #2e1065;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        body.mode-wishlist .card:hover {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-4px);
        }

        body.mode-wishlist .tag {
            background-color: #0d0714;
            border-color: #4c1d95;
            color: #d8b4fe;
        }

        body.mode-wishlist .prio-box {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: auto;
            align-self: flex-start;
        }

        body.mode-wishlist .prio-alta {
            background-color: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.5);
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.3);
        }

        body.mode-wishlist .prio-media {
            background-color: rgba(234, 179, 8, 0.2);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.5);
        }

        body.mode-wishlist .prio-baja {
            background-color: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        body.mode-wishlist .pagination button {
            background-color: #160d27;
            border-color: #3b0764;
        }

        body.mode-wishlist .pagination button:not(:disabled):hover {
            background-color: #a855f7;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- BARRA SUPERIOR (CHECKBOX A LA IZQ / SWITCH A LA DER) -->
    <div class="top-bar">
        <!-- Esquina Superior Izquierda: Checkbox Backlog -->
        <label class="backlog-container" id="backlogWrapper" title="Ver solo juegos poseídos aún no terminados">
            <input type="checkbox" id="chkBacklog" onchange="resetYFiltrar()">
            <span><i class="fa-solid fa-box-archive"></i> Ver Backlog</span>
        </label>

        <!-- Esquina Superior Derecha: Switch Modo -->
        <div class="toggle-container" onclick="toggleModo()">
            <div id="lblJuegoteca" class="toggle-btn active"><i class="fa-solid fa-gamepad"></i> Juegoteca</div>
            <div id="lblWishlist" class="toggle-btn"><i class="fa-solid fa-bookmark"></i> Wishlist</div>
        </div>
    </div>

    <header>
        <h1 id="mainTitle"><i class="fa-solid fa-ghost"></i> LA JUEGOTECA DEL SEÑOR GRIS</h1>
    </header>

    <div class="stats-grid" id="stats">
        <!-- Generado dinámicamente -->
    </div>

    <div class="filters">
        <input type="text" id="fNombre" placeholder="Buscar por título o dev..." oninput="resetYFiltrar()">
        <select id="fPlataforma" onchange="resetYFiltrar()"></select>
        <select id="fAño" onchange="resetYFiltrar()"></select>
        <select id="fAñoSalida" onchange="resetYFiltrar()"></select>
        <select id="fPrioridad" onchange="resetYFiltrar()" style="display: none;">
            <option value="">Todas las Prioridades</option>
            <option value="Alta">🔥 Prioridad Alta</option>
            <option value="Media">✨ Prioridad Media</option>
            <option value="Baja">💤 Prioridad Baja</option>
        </select>
        <select id="fOrder" onchange="resetYFiltrar()"></select>
        <button class="btn-clear" onclick="limpiarFiltros()"><i class="fa-solid fa-rotate-left"></i> Limpiar</button>
    </div>

    <div class="grid" id="grid">
        <!-- Tarjetas dinámicas -->
    </div>

    <div class="pagination">
        <button id="btnPrev" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
        <span id="pageInfo">Página 1</span>
        <button id="btnNext" onclick="changePage(1)">Siguiente <i class="fa-solid fa-chevron-right"></i></button>
    </div>
</div>

<div class="lightbox" id="lightbox" onclick="cerrarImagen()">
    <img id="lightbox-img" src="" alt="Captura ampliada">
</div>

<script>
    // URLS DE LAS DOS HOJAS EN FORMATO CSV
    const urlJuegoteca = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVA5GnUSczsHp84ffYDXJJcZR4dKBe_qjAwNiQasaniWZpf9GjPwvEC4Tk_RPPG_ZuHymjLEAdau_z/pub?output=csv';
    const urlWishlist = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVA5GnUSczsHp84ffYDXJJcZR4dKBe_qjAwNiQasaniWZpf9GjPwvEC4Tk_RPPG_ZuHymjLEAdau_z/pub?gid=1285884416&single=true&output=csv';

    let modoActual = 'juegoteca';
    let datosOriginales = [];
    let datosFiltrados = [];
    let paginaActual = 1;
    const itemsPorPagina = 12;

    function recortarTexto(texto, maxChars = 20) {
        if (!texto) return '';
        return texto.length > maxChars ? texto.substring(0, maxChars) + '...' : texto;
    }

    function toggleModo() {
        modoActual = modoActual === 'juegoteca' ? 'wishlist' : 'juegoteca';
        
        if (modoActual === 'wishlist') {
            document.body.classList.add('mode-wishlist');
            document.getElementById('lblJuegoteca').classList.remove('active');
            document.getElementById('lblWishlist').classList.add('active');
            document.getElementById('mainTitle').innerHTML = `<i class="fa-solid fa-bookmark"></i> WISHLIST DEL SEÑOR GRIS`;
            document.getElementById('fAño').style.display = 'none';
            document.getElementById('fPrioridad').style.display = 'block';
            document.getElementById('backlogWrapper').style.visibility = 'hidden'; // Oculta opción backlog en wishlist
        } else {
            document.body.classList.remove('mode-wishlist');
            document.getElementById('lblWishlist').classList.remove('active');
            document.getElementById('lblJuegoteca').classList.add('active');
            document.getElementById('mainTitle').innerHTML = `<i class="fa-solid fa-ghost"></i> LA JUEGOTECA DEL SEÑOR GRIS`;
            document.getElementById('fPrioridad').style.display = 'none';
            document.getElementById('backlogWrapper').style.visibility = 'visible'; // Muestra opción backlog
            
            // Ajustar visibilidad de filtro Año según el checkbox de Backlog
            const soloBacklog = document.getElementById('chkBacklog').checked;
            document.getElementById('fAño').style.display = soloBacklog ? 'none' : 'block';
        }

        actualizarOpcionesOrden();
        limpiarFiltros(false);
        cargarDatos();
    }

    function actualizarOpcionesOrden() {
        const select = document.getElementById('fOrder');
        if (modoActual === 'juegoteca') {
            select.innerHTML = `
                <option value="best">Mejor Nota</option>
                <option value="worst">Peor Nota</option>
                <option value="alpha">Alfabético (A-Z)</option>
            `;
        } else {
            select.innerHTML = `
                <option value="prio">Mayor Prioridad</option>
                <option value="alpha">Alfabético (A-Z)</option>
                <option value="release">Año de Lanzamiento (Reciente)</option>
            `;
        }
    }

    async function cargarDatos() {
        const url = modoActual === 'juegoteca' ? urlJuegoteca : urlWishlist;
        
        Papa.parse(url, {
            download: true, 
            header: true, 
            skipEmptyLines: true,
            complete: function(results) {
                datosOriginales = results.data
                    .filter(i => i && i.Nombre && i.Nombre.trim() !== "")
                    .map(item => {
                        const añoRaw = item["Año de terminación"] || "";
                        const añoSalidaRaw = item["Año de salida"] || "";
                        
                        const añoLimpio = añoRaw.toString().replace(/\./g, '').split('.')[0].trim();
                        const añoSalidaLimpio = añoSalidaRaw.toString().replace(/\./g, '').split('.')[0].trim();
                        const prioridad = item["Prioridad"] ? item["Prioridad"].trim() : "Media";

                        return { 
                            ...item, 
                            _añoLimpio: añoLimpio,
                            _añoSalidaLimpio: añoSalidaLimpio,
                            _prioridad: prioridad,
                            _imgUrl: item["URL Captura"] ? item["URL Captura"].trim() : "",
                            _developer: item["Developer"] ? item["Developer"].trim() : ""
                        };
                    });
                
                rellenarCombos();
                resetYFiltrar();
            }
        });
    }

    function rellenarCombos() {
        const platSelect = document.getElementById('fPlataforma');
        const añoSelect = document.getElementById('fAño');
        const añoSalidaSelect = document.getElementById('fAñoSalida');
        
        platSelect.innerHTML = '<option value="">Todas las Plataformas</option>';
        añoSelect.innerHTML = '<option value="">Año en que me lo pasé</option>';
        añoSalidaSelect.innerHTML = '<option value="">Todos los Años de Salida</option>';

        const plataformas = [...new Set(datosOriginales.map(i => i.Plataforma).filter(Boolean))].sort();
        const añosSalida = [...new Set(datosOriginales.map(i => i._añoSalidaLimpio).filter(Boolean))].sort((a,b) => b.localeCompare(a, undefined, {numeric: true}));

        plataformas.forEach(p => platSelect.innerHTML += `<option value="${p}">${p}</option>`);
        añosSalida.forEach(a => añoSalidaSelect.innerHTML += `<option value="${a}">${a}</option>`);

        if (modoActual === 'juegoteca') {
            const años = [...new Set(datosOriginales.map(i => i._añoLimpio).filter(Boolean))].sort((a,b) => b.localeCompare(a, undefined, {numeric: true}));
            años.forEach(a => añoSelect.innerHTML += `<option value="${a}">${a}</option>`);
        }
    }

    function calcularStats(data) {
        const total = data.length;
        let htmlStats = '';

        if (modoActual === 'juegoteca') {
            const esBacklog = document.getElementById('chkBacklog').checked;

            if (esBacklog) {
                let sistemaMasPendiente = "---";
                if (total > 0) {
                    const counts = {};
                    data.forEach(i => {
                        if (i.Plataforma) counts[i.Plataforma] = (counts[i.Plataforma] || 0) + 1;
                    });
                    if (Object.keys(counts).length > 0) {
                        sistemaMasPendiente = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                    }
                }

                htmlStats = `
                    <div class="stat-card"><span>Juegos en Backlog</span><strong>${total}</strong></div>
                    <div class="stat-card"><span>Estado</span><strong>⏳ Pendientes</strong></div>
                    <div class="stat-card"><span>Plataforma Principal</span><strong>${sistemaMasPendiente}</strong></div>
                `;
            } else {
                const sumaNotas = data.reduce((acc, curr) => acc + parseFloat(curr.Puntuación || 0), 0);
                const media = total > 0 ? (sumaNotas / total).toFixed(2) : "0.00";
                
                let sistemaMasJugado = "---";
                if (total > 0) {
                    const counts = {};
                    data.forEach(i => {
                        if (i.Plataforma) counts[i.Plataforma] = (counts[i.Plataforma] || 0) + 1;
                    });
                    if (Object.keys(counts).length > 0) {
                        sistemaMasJugado = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                    }
                }

                htmlStats = `
                    <div class="stat-card"><span>Registros mostrados</span><strong>${total}</strong></div>
                    <div class="stat-card"><span>Nota Media (Vista)</span><strong>${media}</strong></div>
                    <div class="stat-card"><span>Sistema más jugado</span><strong>${sistemaMasJugado}</strong></div>
                `;
            }
        } else {
            const altaPrioridad = data.filter(i => i._prioridad.toLowerCase() === 'alta').length;
            
            let sistemaMasDeseado = "---";
            if (total > 0) {
                const counts = {};
                data.forEach(i => {
                    if (i.Plataforma) counts[i.Plataforma] = (counts[i.Plataforma] || 0) + 1;
                });
                if (Object.keys(counts).length > 0) {
                    sistemaMasDeseado = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
                }
            }

            htmlStats = `
                <div class="stat-card"><span>Deseados mostrados</span><strong>${total}</strong></div>
                <div class="stat-card"><span>Prioridad Alta</span><strong>${altaPrioridad}</strong></div>
                <div class="stat-card"><span>Plataforma Principal</span><strong>${sistemaMasDeseado}</strong></div>
            `;
        }

        document.getElementById('stats').innerHTML = htmlStats;
    }

    function getIconHTML(plat) {
        if (!plat) return `<i class="fa-solid fa-gamepad"></i>`;
        const p = plat.toLowerCase();
        
        if (p.includes('mega drive') || p.includes('master system') || p.includes('game gear') || p.includes('dreamcast') || p.includes('saturn') || p.includes('sega')) {
            return `<i class="fa-regular fa-circle" style="color: #fbbf24; font-weight: 900;" title="SEGA"></i>`;
        }
        if (p.includes('nintendo') || p.includes('switch') || p.includes('wii') || p.includes('ds') || p.includes('nes') || p.includes('snes') || p.includes('64') || p.includes('gamecube') || p.includes('game boy') || p.includes('gameboy')) {
            return `<span style="color: #e60012; font-weight: 900; font-family: 'Arial Black', sans-serif;">N</span>`;
        }
        if (p.includes('playstation') || p.includes('ps')) {
            return `<i class="fa-brands fa-playstation" style="color: #3b82f6;"></i>`;
        }
        if (p.includes('xbox')) {
            return `<i class="fa-brands fa-xbox" style="color: #22c55e;"></i>`;
        }
        if (p.includes('steam')) return `<i class="fa-brands fa-steam"></i>`;
        if (p.includes('pc') || p.includes('epic') || p.includes('gog') || p.includes('origin')) return `<i class="fa-solid fa-desktop"></i>`;
        if (p.includes('arcade')) return `<i class="fa-solid fa-ghost"></i>`;
        if (p.includes('vr')) return `<i class="fa-solid fa-vr-cardboard"></i>`;
        if (p.includes('android')) return `<i class="fa-brands fa-android"></i>`;

        return `<i class="fa-solid fa-gamepad"></i>`;
    }

    function renderizar() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const inicio = (paginaActual - 1) * itemsPorPagina;
        const items = datosFiltrados.slice(inicio, inicio + itemsPorPagina);

        items.forEach(item => {
            const imgHTML = item._imgUrl 
                ? `<div class="card-img-container" onclick="abrirImagen('${item._imgUrl}')">
                    <img src="${item._imgUrl}" alt="${item.Nombre}" loading="lazy" onerror="this.parentElement.style.display='none'">
                   </div>` 
                : '';

            const devHTML = item._developer 
                ? `<span class="tag" title="Desarrollador: ${item._developer}"><i class="fa-solid fa-code"></i> ${recortarTexto(item._developer, 22)}</span>` 
                : '';

            const añoSalidaHTML = item._añoSalidaLimpio 
                ? `<span class="tag" title="Año de lanzamiento"><i class="fa-solid fa-rocket"></i> ${item._añoSalidaLimpio}</span>` 
                : '';

            const commentHTML = (item.Comentario && item.Comentario !== "NaN") 
                ? `<div class="comment">${item.Comentario}</div>` 
                : '';

            let mainStatHTML = '';

            if (modoActual === 'juegoteca') {
                const esBacklog = !item._añoLimpio;

                if (esBacklog) {
                    mainStatHTML = `
                        <div class="tag-row">
                            <span class="tag">${getIconHTML(item.Plataforma)} ${item.Plataforma || ''}</span>
                            ${devHTML}
                            ${añoSalidaHTML}
                        </div>
                        <div class="score-box score-backlog">
                            ⏳ Pendiente (Backlog)
                        </div>
                    `;
                } else {
                    const nota = parseFloat(item.Puntuación || 0);
                    let scoreClass = '';
                    if (nota >= 9) scoreClass = 'score-gold';
                    else if (nota >= 7) scoreClass = 'score-good';
                    else if (nota < 5) scoreClass = 'score-mid';

                    const añoTerminadoHTML = `<span class="tag" title="Año en que me lo pasé por última vez"><i class="fa-regular fa-calendar-check"></i> ${item._añoLimpio}</span>`;

                    mainStatHTML = `
                        <div class="tag-row">
                            <span class="tag">${getIconHTML(item.Plataforma)} ${item.Plataforma || ''}</span>
                            ${devHTML}
                            ${añoSalidaHTML}
                            ${añoTerminadoHTML}
                        </div>
                        <div class="score-box ${scoreClass}">
                            ${nota >= 9 ? '⭐' : '🔘'} ${item.Puntuación}/10
                        </div>
                    `;
                }
            } else {
                const prio = item._prioridad.toLowerCase();
                let prioClass = 'prio-media';
                let prioIcon = '✨';
                
                if (prio === 'alta') { prioClass = 'prio-alta'; prioIcon = '🔥'; }
                else if (prio === 'baja') { prioClass = 'prio-baja'; prioIcon = '💤'; }

                mainStatHTML = `
                    <div class="tag-row">
                        <span class="tag">${getIconHTML(item.Plataforma)} ${item.Plataforma || ''}</span>
                        ${devHTML}
                        ${añoSalidaHTML}
                    </div>
                    <div class="prio-box ${prioClass}">
                        ${prioIcon} Prioridad: ${item._prioridad}
                    </div>
                `;
            }

            grid.innerHTML += `
                <div class="card">
                    ${imgHTML}
                    <div class="card-body">
                        <h3>${item.Nombre}</h3>
                        ${mainStatHTML}
                        ${commentHTML}
                    </div>
                </div>
            `;
        });
        actualizarControles();
    }

    function abrirImagen(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function cerrarImagen() {
        document.getElementById('lightbox').style.display = 'none';
    }

    function limpiarFiltros(ejecutarFiltrado = true) {
        document.getElementById('fNombre').value = '';
        document.getElementById('fPlataforma').value = '';
        document.getElementById('fAño').value = '';
        document.getElementById('fAñoSalida').value = '';
        document.getElementById('fPrioridad').value = '';
        
        if (modoActual === 'juegoteca') {
            document.getElementById('fOrder').value = 'best';
        } else {
            document.getElementById('fOrder').value = 'prio';
        }

        if (ejecutarFiltrado) resetYFiltrar();
    }

    function filtrarYOrdenar() {
        const n = document.getElementById('fNombre').value.toLowerCase();
        const p = document.getElementById('fPlataforma').value;
        const aSalida = document.getElementById('fAñoSalida').value;
        const order = document.getElementById('fOrder').value;

        if (modoActual === 'juegoteca') {
            const a = document.getElementById('fAño').value;
            const soloBacklog = document.getElementById('chkBacklog').checked;

            // Control de visibilidad del filtro "Año en que me lo pasé"
            document.getElementById('fAño').style.display = soloBacklog ? 'none' : 'block';

            datosFiltrados = datosOriginales.filter(i => {
                const coincideNombre = ((i.Nombre && i.Nombre.toLowerCase().includes(n)) || (i._developer && i._developer.toLowerCase().includes(n)));
                const coincidePlat = (p === "" || i.Plataforma === p);
                const coincideAñoSalida = (aSalida === "" || i._añoSalidaLimpio === aSalida);

                // Filtrado por Backlog vs Completados
                if (soloBacklog) {
                    return coincideNombre && coincidePlat && coincideAñoSalida && (!i._añoLimpio);
                } else {
                    const coincideAño = (a === "" || i._añoLimpio === a);
                    return coincideNombre && coincidePlat && coincideAñoSalida && coincideAño && (i._añoLimpio !== "");
                }
            });

            datosFiltrados.sort((a, b) => {
                const nA = parseFloat(a.Puntuación || 0);
                const nB = parseFloat(b.Puntuación || 0);
                if (order === 'best') return nB - nA;
                if (order === 'worst') return nA - nB;
                if (order === 'alpha') return a.Nombre.localeCompare(b.Nombre);
            });
        } else {
            const prio = document.getElementById('fPrioridad').value;

            datosFiltrados = datosOriginales.filter(i => 
                ((i.Nombre && i.Nombre.toLowerCase().includes(n)) || (i._developer && i._developer.toLowerCase().includes(n))) &&
                (p === "" || i.Plataforma === p) &&
                (aSalida === "" || i._añoSalidaLimpio === aSalida) &&
                (prio === "" || i._prioridad.toLowerCase() === prio.toLowerCase())
            );

            const pesoPrio = { "alta": 3, "media": 2, "baja": 1 };

            datosFiltrados.sort((a, b) => {
                if (order === 'prio') {
                    const pA = pesoPrio[a._prioridad.toLowerCase()] || 0;
                    const pB = pesoPrio[b._prioridad.toLowerCase()] || 0;
                    return pB - pA;
                }
                if (order === 'alpha') return a.Nombre.localeCompare(b.Nombre);
                if (order === 'release') return b._añoSalidaLimpio.localeCompare(a._añoSalidaLimpio, undefined, {numeric: true});
            });
        }

        calcularStats(datosFiltrados);
        renderizar();
    }

    function resetYFiltrar() { paginaActual = 1; filtrarYOrdenar(); }
    function changePage(d) { paginaActual += d; renderizar(); window.scrollTo({top:0, behavior:'smooth'}); }
    function actualizarControles() {
        const total = Math.ceil(datosFiltrados.length / itemsPorPagina);
        document.getElementById('pageInfo').innerText = `Página ${paginaActual} de ${total || 1}`;
        document.getElementById('btnPrev').disabled = paginaActual === 1;
        document.getElementById('btnNext').disabled = paginaActual >= total || total === 0;
    }

    // Inicialización
    actualizarOpcionesOrden();
    cargarDatos();
</script>
</body>
</html>
